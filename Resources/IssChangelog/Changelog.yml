Name: Changelog
Order: 0
Entries:
- author: issyman182
  version: iss14:1.8.4
  time: '2026-08-28'
  changes:
  - message: 'The casino grows: the coin flipper (double-or-nothing on your whole stack), the claw machine (free to play, plushie prizes - emag it at your own risk) and the QM''s personal high roller slot machine joined the slot machine. Coin flipper and claw machine are in cargo''s service catalogue.'
    type: Add
  - message: 'Your organs now care about your lifestyle: heavy drinking wears down the liver and kidneys, smoking wears down the lungs, and stimulant abuse (meth, hyperzine, too much epinephrine) strains the heart. Light damage heals back on its own after a while - sustained abuse builds up damage, causes pain and eventually needs surgery.'
    type: Add
  - message: Organ damage from wounds actually works now - organ integrity and severity were calculated wrong, so organs never degraded (and being shot in the liver could even heal it).
    type: Fix
  - message: New Swedish speech trait, ported from Trauma-Station. Bork bork.
    type: Add
  - message: Salvage cyborgs can get a proto-kinetic accelerator module, unlocked by the Salvage Weapons research and printed at the exosuit fabricator.
    type: Add
  - message: The Chief Engineer now spawns with their over-ear headset instead of the basic one.
    type: Tweak
  - message: Civilian Services research tier 3 (speed boots, bluespace chemistry...) is reachable again - the surgery techs had silently pushed the tier gate to 11 researched techs.
    type: Fix
  - message: The Mass Hallucinations event no longer occurs randomly.
    type: Tweak
  id: 18
- author: issyman182
  version: iss14:1.8.3
  time: '2026-08-28'
  changes:
  - message: Updated upstream Space Station 14 to the 2026-08-28 build (119 new upstream changes merged).
    type: Tweak
  - message: Updated the game engine (RobustToolbox) from 288.1.0 to 289.0.0.
    type: Tweak
  - message: 'Slot machine, ported from Goobstation: feed it a stack of spesos, pull the lever and gamble your paycheck away. Cargo can order one from the service catalogue for 1000 spesos - the crate holds a flatpack you deploy wherever you want your casino.'
    type: Add
  - message: Arachnids could not spawn at all after the upstream merge, and cloning no longer spams errors about the clumsy and mute traits.
    type: Fix
  id: 17
- author: issyman182
  version: iss14:1.8.2
  time: '2026-07-25'
  changes:
  - message: Gunshot residue — firing a gun (except energy weapons) leaves residue behind, detectable with the forensic scanner. A rag wipes it away, so clean up after your crimes. (by RoxyyGooberr)
    type: Add
  - message: New pretzel snacks, in regular and moth-friendly variants. (by RoxyyGooberr)
    type: Add
  - message: Peer Review Console upgrades — a reworked UI and a publication system with minor, significant and major tiers via the Station Library Research Publication Service. The console can now also be hacked through its wire panel, and the Head of Personnel gained Library access. (by SpotsDots16)
    type: Tweak
  - message: Tajaran cat ears actually work — they hear speech and whispers 20% farther than other species, and "psps" calls carry twice as far, whispered or not.
    type: Add
  - message: The Insurgency no longer shows up at the start of every secret round. Instead, the insurgent ship can rarely arrive mid-round (40+ minutes in, 10+ players, at most once per round) — its 1-4 slots are offered to ghosts as ghost roles, so nobody gets pulled out of their character.
    type: Tweak
  - message: OOC chat is now disabled while the round is running and comes back automatically at round end.
    type: Tweak
  - message: Antag selection now rolls before job assignment — you can prioritize command roles and still roll antag. If you win the antag roll, you spawn in a non-command job that round instead; if not, you get your command role as usual.
    type: Tweak
  id: 16
- author: issyman182
  version: iss14:1.8.1
  time: '2026-07-22'
  changes:
  - message: Updated upstream Space Station 14 to the 2026-07-21 build (431 new upstream changes merged).
    type: Tweak
  - message: Updated the game engine (RobustToolbox) from 277.0.0 to 283.1.0.
    type: Tweak
  - message: Replay fixes — round replays are now recorded as self-contained content bundles you can play straight from the launcher, and replay loading no longer breaks when a recording contains broken prototypes or missing entities.
    type: Fix
  id: 15
- author: issyman182
  version: iss14:1.8.0
  time: '2026-07-18'
  changes:
  - message: New playable species — Tajaran! Cat-people with their own ears, tails and voices — they mew, meow, hiss, purr, growl and trill, wag their tails, fight with claws, and carry compound names like Familygiven. As obligate carnivores they need meat-based food.
    type: Add
  - message: NanoChat — a PDA text-messaging cartridge. Get a number, message other crew, mute annoying contacts. Microwaving the card scrambles (or if you're lucky, erases) your message history.
    type: Add
  - message: New antagonist — the Insurgency. An armed insurgent cell arrives on its own shuttle with its own gear and objectives.
    type: Add
  - message: Station AI rework — the AI can now shunt itself into cyborgs with an AI vassal core and back, and its warp menu was rebuilt. Carrying an intellicarded AI to a cyborg lets you install it as the borg's brain.
    type: Add
  - message: New science machine — the Peer Review Console. Artifact extraction now prints a research paper, and submitting papers to the console grants extra research points. Buildable from a circuit board and present on every station map.
    type: Add
  - message: Armor coverage — armor now only protects the body parts it actually covers. A helmet does nothing for your chest, a vest does nothing for your head.
    type: Add
  - message: New CentComm hardsuit (with helmet) and green CentCom glasses.
    type: Add
  - message: Empty cigarette cartons and packs can now be crafted, filled and refilled.
    type: Add
  - message: Your job icon in radio chat now comes from the ID in your PDA — carry no ID and you show up as unknown.
    type: Tweak
  - message: Early evac shuttle launch can no longer be spam-toggled — after unauthorizing it there is a 30 second cooldown.
    type: Tweak
  - message: Fixed round start being randomly delayed by 30 seconds when the picked game mode could not start.
    type: Fix
  id: 14
- author: issyman182
  version: iss14:1.7.2
  time: '2026-07-10'
  changes:
  - message: Fixed armor not reducing damage from attacks — every vest, helmet and hardsuit was silently providing no protection in combat.
    type: Fix
  - message: Armor-piercing ammunition actually penetrates armor now.
    type: Fix
  - message: Aimed shots with guns now drift toward the chest beyond point-blank range — headshots require getting close.
    type: Tweak
  - message: Skeletons can be healed with medical items again — and splashing milk on them restores their calcium once more.
    type: Fix
  - message: Fixed the health analyzer showing about half blood on perfectly healthy patients.
    type: Fix
  id: 13
- author: issyman182
  version: iss14:1.7.1
  time: '2026-07-09'
  changes:
  - message: Fixed everyone spawning without blood — drawing blood and injecting meds with syringes, hyposprays and jet injectors works again.
    type: Fix
  - message: Fixed food, drinks and pills having no effect. Eating restores hunger again, ingested medicine and poisons work, and the stomach no longer clogs up with "You can't eat any more!".
    type: Fix
  - message: Fixed blood-restoring items (like blood packs) being refused on bleeding patients — and an exploit where they restored blood without being used up.
    type: Fix
  - message: Chemicals in your bloodstream no longer mask real blood loss.
    type: Fix
  - message: Suffocating grabs and the Krav Maga breath block now actually stop the victim from breathing.
    type: Fix
  - message: Fixed the body inspection window and self-examine showing raw text markup instead of formatted text.
    type: Fix
  - message: Fixed missing text in several places — the character editor markings tab, examining yourself, drained surgical multitools and the Autodoc menu.
    type: Fix
  - message: Ephedrine's pain suppression was twice as strong as intended.
    type: Tweak
  id: 12
- author: issyman182
  version: iss14:1.7.0
  time: '2026-07-08'
  changes:
  - message: Surgery! Bodies are now made of real parts and organs (Shitmed port). Perform surgery at operating tables — amputate and reattach limbs, transplant organs, install implants and augments — and target individual body parts with the new targeting doll. Includes the Autodoc for automated procedures.
    type: Add
  - message: Grabbing and martial arts (ported from Goobstation). Grab people with escalating grip strength, shove them around or throw them, and fight with martial arts techniques.
    type: Add
  - message: News articles published by station reporters are now posted to our Discord server as soon as they go out.
    type: Add
  - message: Fixed cyborg module items (like the medical borg's beakers) permanently disappearing.
    type: Fix
  - message: Fixed spider venom never regenerating.
    type: Fix
  - message: Fixed broken species pages in the guidebook.
    type: Fix
  id: 11
- author: issyman182
  version: iss14:1.6.1
  time: '2026-06-30'
  changes:
  - message: Executions with guns — ready a firearm against someone's head for a point-blank kill, or turn it on yourself.
    type: Add
  - message: Cryo pods now treat the dead. Cryoxadone and Doxarubixadone keep working on a dead patient, so a body left in a cryo pod can be healed back to revivable.
    type: Tweak
  - message: Fixed Text-To-Speech voices overlapping and talking over each other.
    type: Fix
  id: 10
- author: issyman182
  version: iss14:1.6.0
  time: '2026-06-28'
  changes:
  - message: Text-To-Speech! Characters can now speak out loud — either Sims-style gibberish blips or real neural voices (when the server has a voice backend set up). Pick your character's gibberish voice in the character editor and tune everything in Options -> Audio.
    type: Add
  - message: New trait — Deaf. You hear no local speech, whispers or radio (including your own voice).
    type: Add
  - message: New trait — Hard of Hearing. Nearby speech is clear, mid-range speech is garbled, and far-away speech is silent.
    type: Add
  - message: Fixed disposals breaking when used normally.
    type: Fix
  id: 9
- author: issyman182
  version: iss14:1.5.0
  time: '2026-06-24'
  changes:
  - message: Sprint! Press or hold Space to sprint, drawing from your stamina pool (ported from Goobstation).
    type: Add
  - message: Added a search box to the keybinds options menu to quickly find a binding.
    type: Add
  - message: Added the ISS changelog and an in-client fork version display.
    type: Add
  - message: The Power Grid Check event now fires less often and the blackout is shorter.
    type: Tweak
  - message: Disposals are now much harder to escape from.
    type: Tweak
  id: 8
- author: issyman182
  version: iss14:1.4.0
  time: '2026-06-22'
  changes:
  - message: New cyborg brain — the AI vassal core. The Station AI can take control of a cyborg that has an AI vassal core as its brain.
    type: Add
  - message: The Station AI can now warp to players and stations.
    type: Add
  - message: New hoverboard, orderable from cargo in a hoverboard crate.
    type: Add
  - message: New Life / respawn, including new rules.
    type: Add
  id: 7
- author: issyman182
  version: iss14:1.3.0
  time: '2026-06-20'
  changes:
  - message: New ruleset — the in-game Server Rules guidebook was rewritten.
    type: Tweak
  - message: Both clients now work — players on PlaySS14 and the Steam version can join (the server validates logins against multiple auth servers).
    type: Add
