# Actions
- type: entity
  parent: BaseAction
  id: ActionJumpToCore
  name: Jump to core
  description: Sends your eye back to the core.
  components:
  - type: Action
    priority: -9
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/actions_ai.rsi
    layers:
    - state: ai_core
  - type: InstantAction
    event: !type:JumpToCoreEvent

# Starlight AI actions (ported from starlight-ss14)
- type: entity
  parent: BaseMentalAction
  id: ActionAIShunt
  name: Shunt
  description: Shunt into a borg chassis with a AI interface installed.
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: 1
  - type: Sprite # iss14: action icons live on a Sprite component now
    sprite: _Starlight/Interface/Actions/actions_shunt.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
    - state: icon-on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: false # no whitelist cause the posibrain has the shunt comp. not the chassis.
    whitelist:
      components:
      - StationAIShunt
    event: !type:AIShuntActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionAIUnShunt
  name: UnShunt
  description: Disengage from the chassis/interface returning to your core.
  components:
  - type: Action
    useDelay: 1
  - type: Sprite # iss14: action icons live on a Sprite component now
    sprite: _Starlight/Interface/Actions/actions_shunt.rsi
    layers:
    - state: icon-unshunt
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:AIUnShuntActionEvent

- type: entity
  parent: BaseAction
  id: ActionAIWarp
  name: Warp
  description: Open a list of crew and locations to warp to.
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite # iss14: action icons live on a Sprite component now
    sprite: Interface/Actions/actions_ai.rsi
    layers:
    - state: warp
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:StationAiOpenWarpActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionAIViewLaws
  name: View Laws
  description: View the laws that you must follow.
  components:
  - type: Action
    priority: -3
    itemIconStyle: NoItem
    useDelay: 0.5
  - type: Sprite
    sprite: Interface/Actions/actions_ai.rsi
    layers:
    - state: state_laws
  - type: InstantAction
    event: !type:ToggleLawsScreenEvent
