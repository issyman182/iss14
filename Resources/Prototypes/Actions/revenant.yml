- type: entity
  parent: ActionIntrinsicStore
  id: ActionRevenantShop
  name: Shop
  description: Opens the ability shop.

- type: entity
  parent: BaseAction
  id: ActionRevenantDefile
  name: Defile
  description: Costs 30 Essence.
  components:
  - type: Action
    useDelay: 15
    itemIconStyle: BigAction
  - type: Sprite
    layers:
    - texture: Interface/Actions/defile.png
  - type: InstantAction
    event: !type:RevenantDefileActionEvent

- type: entity
