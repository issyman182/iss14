# iss14: free visibility toggle (uses the xenoborg cloaking module sprite)
- type: entity
  parent: BaseAction
  id: ActionRevenantToggleCorporeal
  name: Corporeal
  description: Freely switch between being visible and invisible. Costs no essence.
  components:
  - type: Action
    useDelay: 2
    itemIconStyle: BigAction
  - type: Sprite # iss14: action icons live on a Sprite component now
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: xenoborg_stealth
      map: ["enum.ActionVisuals.Icon"]
    - state: icon-xenoborg-cloak
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:RevenantToggleCorporealActionEvent

