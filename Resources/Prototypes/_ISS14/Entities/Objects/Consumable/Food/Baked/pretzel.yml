# DON'T FORGET TO PUT A SPRITE

- type: entity
  abstract: true
  parent: [SolutionVeryTiny, FoodInjectableBase]
  id: FoodPretzelBase
  description: A warm, twisted bread snack.
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
      - bread
  - type: Sprite
    sprite: _ISS14/Objects/Consumable/Food/Baked/pretzel.rsi
    state: pretzel
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
        
- type: entity
  parent: FoodPretzelBase
  id: FoodPretzel
  name: pretzel
  
- type: entity
  parent: FoodPretzelBase
  id: FoodPretzelSalted
  name: salted pretzel
  description: A nice and salted, warm, twisted bread snack.
  components:
  - type: FlavorProfile
    flavors:
    - bread
    - salty
  - type: Sprite
    state: pretzel-salted
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: TableSalt
        Quantity: 5
        
- type: entity
  parent: FoodPretzelBase
  id: FoodPretzelCotton
  name: cotton pretzel
  description: A warm, twisted cloth bread snack.
  components:
  - type: FlavorProfile
    flavors:
    - bread
    - cotton
  - type: Sprite
    state: pretzel-cottondough
  - type: Edible
    requiresSpecialDigestion: true
  - type: Tag
    tags:
    - ClothMade
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Fiber
        Quantity: 5
        
- type: entity
  parent: FoodPretzelBase
  id: FoodPretzelCottonSalted
  name: salted cotton pretzel
  description: A warm, twisted cloth bread snack. With added salt!
  components:
  - type: FlavorProfile
    flavors:
    - bread
    - cotton
    - salty
  - type: Sprite
    state: pretzel-cottondough-salted
  - type: Edible
    requiresSpecialDigestion: true
  - type: Tag
    tags:
    - ClothMade
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Fiber
        Quantity: 5
      - ReagentId: TableSalt
        Quantity: 5