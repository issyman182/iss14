- type: entity
  parent: BaseFlatpack
  id: TaskBoardFlatpack
  name: task board flatpack
  description: A flatpack used for constructing a service task board.
  components:
  - type: Flatpack
    entity: TaskBoard
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#e0c05f"
      map: ["enum.FlatpackVisualLayers.Overlay"]
    - state: icon-default

