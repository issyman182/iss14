# iss14: Economy — department task boards.
- type: entity
  parent: [ BaseMachinePowered, BaseMachineDestructible ]
  id: TaskBoard
  name: task board
  description: A department task board. Claim tasks and contracts, hand in deliveries, get paid.
  components:
  - type: Sprite
    sprite: _ISS14/Structures/Machines/task_board.rsi
    snapCardinals: true
    layers:
    - state: off
    - state: normal-unshaded
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.WiresVisualLayers.MaintenancePanel:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: Damageable
    damageModifierSet: GlassReinforcedMod
  - type: Repairable
    doAfterDelay: 8
  - type: StationAiWhitelist
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 3
    enabled: false
    sound:
      path: /Audio/Ambience/Objects/vending_machine_hum.ogg
  - type: ApcPowerReceiver
    powerLoad: 150
  - type: LitOnPowered
  - type: PointLight
    enabled: false
    castShadows: false
    radius: 1.5
    color: "#e0c05f"
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: WiresPanel
  - type: WiresVisuals
  - type: StaticPrice
    price: 400
  - type: TaskBoard
    account: Service
  - type: ActivatableUI
    key: enum.TaskBoardUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.TaskBoardUiKey.Key:
        type: TaskBoardBoundUserInterface


