# iss14: Economy — the station task board.
# One board serves every department: the ID card of the person using it decides which departments' tasks they
# see. People with no department see nothing.
- type: entity
  parent: [ BaseMachinePowered, BaseMachineDestructible ]
  id: TaskBoard
  name: task board
  description: The station task board. Department staff claim tasks and contracts, hand in deliveries and get paid.
  components:
  - type: Sprite
    sprite: _ISS14/Structures/Machines/task_board.rsi
    snapCardinals: true
    layers:
    - state: off
    - state: normal-unshaded
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.WiresVisualLayers.MaintenancePanel:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: Damageable
    damageModifierSet: GlassReinforcedMod
  - type: Repairable
    doAfterDelay: 8
  - type: StationAiWhitelist
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 3
    enabled: false
    sound:
      path: /Audio/Ambience/Objects/vending_machine_hum.ogg
  - type: ApcPowerReceiver
    powerLoad: 150
  - type: LitOnPowered
  - type: PointLight
    enabled: false
    castShadows: false
    radius: 1.5
    color: "#e0c05f"
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: WiresPanel
  - type: WiresVisuals
  - type: StaticPrice
    price: 400
  - type: TaskBoard
  - type: ActivatableUI
    key: enum.TaskBoardUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.TaskBoardUiKey.Key:
        type: TaskBoardBoundUserInterface


# Legacy ids: there used to be one board per department. Existing maps and flatpacks may still reference these;
# they are plain task boards now.
- type: entity
  parent: TaskBoard
  id: TaskBoardCargo
  suffix: legacy

- type: entity
  parent: TaskBoard
  id: TaskBoardEngineering
  suffix: legacy

- type: entity
  parent: TaskBoard
  id: TaskBoardMedical
  suffix: legacy

- type: entity
  parent: TaskBoard
  id: TaskBoardScience
  suffix: legacy

- type: entity
  parent: TaskBoard
  id: TaskBoardSecurity
  suffix: legacy

- type: entity
  parent: BaseFlatpack
  id: TaskBoardFlatpack
  name: task board flatpack
  description: A flatpack used for constructing a task board.
  components:
  - type: Flatpack
    entity: TaskBoard
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#e0c05f"
      map: ["enum.FlatpackVisualLayers.Overlay"]
    - state: icon-default

# Legacy flatpack ids, all unpack into the plain board.
- type: entity
  parent: TaskBoardFlatpack
  id: TaskBoardCargoFlatpack
  suffix: legacy

- type: entity
  parent: TaskBoardFlatpack
  id: TaskBoardEngineeringFlatpack
  suffix: legacy

- type: entity
  parent: TaskBoardFlatpack
  id: TaskBoardMedicalFlatpack
  suffix: legacy

- type: entity
  parent: TaskBoardFlatpack
  id: TaskBoardScienceFlatpack
  suffix: legacy

- type: entity
  parent: TaskBoardFlatpack
  id: TaskBoardSecurityFlatpack
  suffix: legacy

- type: entity
  id: CrateTaskBoards
  parent: CrateGenericSteel
  name: task board crate
  description: Two task board flatpacks.
  components:
  - type: StorageFill
    contents:
    - id: TaskBoardFlatpack
      amount: 2
