# iss14: Economy — counter cash register (see CashRegisterComponent).
# One register for the whole station. Who may use it and what it sells follows from the cashier's ID card:
# the catalogs below list the access levels of the jobs they are for (the Captain sees all of them).
# People with no matching catalog are customers. Sales go to the cashier's department account.
# The register needs APC power (like a microwave), is moved with a wrench and delivered as a flatpack.

## Catalogs: what a job sells. ##
- type: cashRegisterCatalog
  id: Bar
  name: cash-register-catalog-bar
  access: [ Bar ]
  edible: Drink
  edibleSolution: drink   # glassware from chemistry uses "beaker" and stays out
  priority: 10

- type: cashRegisterCatalog
  id: Kitchen
  name: cash-register-catalog-kitchen
  access: [ Kitchen ]
  edible: Food
  edibleSolution: food
  blacklistComponents: [ Pill ]
  priority: 20

- type: cashRegisterCatalog
  id: Hydroponics
  name: cash-register-catalog-hydroponics
  access: [ Hydroponics ]
  components: [ Produce, Seed ]
  priority: 30

- type: cashRegisterCatalog
  id: Medical
  name: cash-register-catalog-medical
  access: [ Medical, Chemistry, Paramedic ]
  components: [ Pill, Healing, Injector ]
  priority: 40

## The machine ##
- type: entity
  parent: [ BaseMachine, StructureHealthMachineWeak ]
  id: CashRegister
  name: cash register
  description: A NanoTrasen point-of-sale terminal. Staff ring up the goods, customers pay with their ID or spesos. Wrench to move it.
  components:
  - type: Sprite
    sprite: _ISS14/Objects/Devices/cash_register.rsi
    drawdepth: SmallObjects
    layers:
    - state: icon
    - state: bill
      map: ["enum.CashRegisterVisualLayers.Screen"]
      visible: false
  - type: Icon
    sprite: _ISS14/Objects/Devices/cash_register.rsi
    state: icon
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CashRegisterVisuals.HasBill:
        enum.CashRegisterVisualLayers.Screen:
          True: { visible: true }
          False: { visible: false }
  - type: InteractionOutline
  - type: Anchorable
    delay: 2
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.25,0.3,0.25"
        density: 40
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: CashRegister
  - type: ApcPowerReceiver
    powerLoad: 5
  - type: ExtensionCableReceiver
  - type: StaticPrice
    price: 150
  - type: UserInterface
    interfaces:
      enum.CashRegisterUiKey.Key:
        type: CashRegisterBoundUserInterface
      enum.CashRegisterUiKey.Customer:
        type: CashRegisterCustomerBoundUserInterface
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2

# Legacy ids: there used to be one register per department. Existing maps and flatpacks may still reference
# these; they are plain cash registers now.
- type: entity
  parent: CashRegister
  id: CashRegisterSecurity
  suffix: legacy

- type: entity
  parent: CashRegister
  id: CashRegisterCargo
  suffix: legacy

- type: entity
  parent: CashRegister
  id: CashRegisterMedical
  suffix: legacy

- type: entity
  parent: CashRegister
  id: CashRegisterScience
  suffix: legacy

- type: entity
  parent: CashRegister
  id: CashRegisterEngineering
  suffix: legacy

## Flatpack: unpack with a multitool where the register should stand. ##
- type: entity
  parent: BaseFlatpack
  id: CashRegisterFlatpack
  name: cash register flatpack
  description: A flatpack used for constructing a cash register. Unpack it with a multitool on the counter.
  components:
  - type: Flatpack
    entity: CashRegister
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#9FED58"
    - sprite: _ISS14/Objects/Devices/cash_register.rsi
      state: icon
      scale: 0.6, 0.6
  - type: StaticPrice
    price: 150

# Legacy flatpack ids, all unpack into the plain register.
- type: entity
  parent: CashRegisterFlatpack
  id: CashRegisterSecurityFlatpack
  suffix: legacy

- type: entity
  parent: CashRegisterFlatpack
  id: CashRegisterCargoFlatpack
  suffix: legacy

- type: entity
  parent: CashRegisterFlatpack
  id: CashRegisterMedicalFlatpack
  suffix: legacy

- type: entity
  parent: CashRegisterFlatpack
  id: CashRegisterScienceFlatpack
  suffix: legacy

- type: entity
  parent: CashRegisterFlatpack
  id: CashRegisterEngineeringFlatpack
  suffix: legacy

- type: entity
  id: CrateCashRegister
  parent: CrateGenericSteel
  name: cash register crate
  description: A crate with a cash register flatpack inside. Unpack it with a multitool, move it with a wrench.
  components:
  - type: StorageFill
    contents:
    - id: CashRegisterFlatpack
