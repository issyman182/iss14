    account: Cargo
    catalogs: [ General ]
  - type: AccessReader
    access: [["Cargo"], ["Quartermaster"], ["Captain"]]

- type: entity
  parent: CashRegister
  id: CashRegisterMedical
  name: medical cash register
  description: A NanoTrasen point-of-sale terminal, bookkept for Medical.
  components:
  - type: CashRegister
    account: Medical
    catalogs: [ Medical, General ]
  - type: AccessReader
    access: [["Medical"], ["ChiefMedicalOfficer"], ["Captain"]]

- type: entity
  parent: CashRegister
  id: CashRegisterScience
  name: science cash register
  description: A NanoTrasen point-of-sale terminal, bookkept for Epistemics.
  components:
