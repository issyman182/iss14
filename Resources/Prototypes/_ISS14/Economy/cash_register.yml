## Flatpacks: unpack with a multitool where the register should stand. ##
- type: entity
  parent: BaseFlatpack
  id: CashRegisterFlatpack
  name: cash register flatpack
  description: A flatpack used for constructing a cash register. Unpack it with a multitool on the counter.
  components:
  - type: Flatpack
    entity: CashRegister
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#9FED58"
    - sprite: _ISS14/Objects/Devices/cash_register.rsi
      state: flatpack
  - type: StaticPrice
    price: 150

