# iss14: Economy — counter cash register (see CashRegisterComponent).
# The register is an anchored machine: wrench to move it, delivered as a flatpack (multitool to unpack).

## Catalogs: what a job sells. The cashier sees the catalogs matching their access. ##
- type: cashRegisterCatalog
  id: Bar
  name: cash-register-catalog-bar
  access: [ Bar ]
  edible: Drink
  edibleSolution: drink   # glassware from chemistry uses "beaker" and stays out
  priority: 10

- type: cashRegisterCatalog
  id: Kitchen
  name: cash-register-catalog-kitchen
  access: [ Kitchen ]
  edible: Food
  edibleSolution: food
  blacklistComponents: [ Pill ]
  priority: 20

- type: cashRegisterCatalog
  id: Hydroponics
  name: cash-register-catalog-hydroponics
  access: [ Hydroponics ]
  components: [ Produce, Seed ]
  priority: 30

- type: cashRegisterCatalog
  id: Medical
  name: cash-register-catalog-medical
  access: [ Medical, Chemistry, Paramedic ]
  components: [ Pill, Healing, Injector ]
  priority: 40

# No filter: lists only what lies on the counter, minus things nobody sells.
- type: cashRegisterCatalog
  id: General
  name: cash-register-catalog-general
  blacklistComponents: [ IdCard, Pda, BankCard, Access, Tool ]
  priority: 100

## The machine ##
- type: entity
  parent: [ BaseMachine, StructureHealthMachineWeak ]
  id: CashRegister
  name: cash register
  description: A NanoTrasen point-of-sale terminal. Staff ring up the goods, customers pay with their ID or spesos. Wrench to move it.
  components:
  - type: Sprite
    sprite: _ISS14/Objects/Devices/cash_register.rsi
    drawdepth: SmallObjects
    layers:
    - state: icon
    - state: bill
      map: ["enum.CashRegisterVisualLayers.Screen"]
      visible: false
  - type: Icon
    sprite: _ISS14/Objects/Devices/cash_register.rsi
    state: icon
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CashRegisterVisuals.HasBill:
        enum.CashRegisterVisualLayers.Screen:
          True: { visible: true }
          False: { visible: false }
  - type: InteractionOutline
  - type: Anchorable
    delay: 2
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.25,0.3,0.25"
        density: 40
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: CashRegister
    catalogs: [ Bar, Kitchen, Hydroponics ]
  - type: StaticPrice
    price: 150
  - type: AccessReader
    access: [["Service"], ["Bar"], ["Kitchen"], ["Hydroponics"], ["HeadOfPersonnel"], ["Captain"]]
  - type: UserInterface
    interfaces:
      enum.CashRegisterUiKey.Key:
        type: CashRegisterBoundUserInterface
      enum.CashRegisterUiKey.Customer:
        type: CashRegisterCustomerBoundUserInterface
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2

- type: entity
  parent: CashRegister
  id: CashRegisterSecurity
  name: security cash register
  description: A NanoTrasen point-of-sale terminal, bookkept for Security. For fines, bribes and donuts.
  components:
  - type: CashRegister
    account: Security
    catalogs: [ General ]
  - type: AccessReader
    access: [["Security"], ["HeadOfSecurity"], ["Captain"]]

- type: entity
  parent: CashRegister
  id: CashRegisterCargo
  name: cargo cash register
  description: A NanoTrasen point-of-sale terminal, bookkept for Logistics.
  components:
