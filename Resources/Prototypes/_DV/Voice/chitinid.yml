# Ported from Goob-Station (originally DeltaV): Chitinid species.

- type: speechVerb
  id: Chitinid
  name: chat-speech-verb-name-chitinid
  speechVerbStrings:
  - chat-speech-verb-chitinid-1
  - chat-speech-verb-chitinid-2
  - chat-speech-verb-chitinid-3
  - chat-speech-verb-chitinid-4

# iss14: Goob's Gulp/Surprised/Belch entries dropped, those emotes don't exist here.
- type: emoteSounds
  id: UnisexChitinid
  voiceSelectorName: humanoid-profile-editor-voice-neutral
  params:
    variation: 0.125
  sounds:
    Buzz:
      path: /Audio/_DV/Voice/Chitinid/moth_scream.ogg
    Scream:
      path: /Audio/Voice/Arachnid/arachnid_scream.ogg
    Laugh:
      path: /Audio/_DV/Voice/Chitinid/moth_laugh.ogg
    Chitter:
      path: /Audio/Voice/Arachnid/arachnid_chitter.ogg
    Click:
      path: /Audio/Voice/Arachnid/arachnid_click.ogg
    Crying:
      collection: FemaleCry
    Weh:
      collection: Weh
    Hew:
      collection: Hew
    Sneeze:
      collection: MaleSneezes
    Cough:
      collection: MaleCoughs
    Yawn:
      collection: MaleYawn
    Hiss:
      path: /Audio/Animals/snake_hiss.ogg
    Gasp:
      collection: MaleGasp
    DefaultDeathgasp:
      collection: MothDeathGasp
    Sigh:
      collection: MaleSigh
    Whistle:
      collection: Whistles
