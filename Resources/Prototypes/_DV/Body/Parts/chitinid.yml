# Ported from Goob-Station (originally DeltaV): Chitinid species.
# iss14: generated from Body/Parts/moth.yml so it matches this fork's part-based body format.

- type: entity
  id: PartChitinidBase
  parent: [BaseItem, BasePart]
  name: "chitinid body part"
  abstract: true
  components:
  - type: WoundableVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Shitmed/Mobs/Effects/brute_damage.rsi
        color: "#507846"
      Burn:
        sprite: _Shitmed/Mobs/Effects/burn_damage.rsi
  - type: Icon # Shitmed Change
    sprite: _DV/Mobs/Species/Chitinid/parts.rsi
  - type: BodyPart # Shitmed Change
    species: Chitinid
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10
  - type: Damageable # Shitmed
    damageModifierSet: Chitinid

- type: entity
  id: ChestChitinid
  name: "chitinid chest"
  parent: [PartChitinidBase, BaseChest]
  components:
  - type: Sprite
    sprite: _DV/Mobs/Species/Chitinid/parts.rsi
    state: "chest_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

