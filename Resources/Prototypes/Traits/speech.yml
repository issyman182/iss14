# If you add a new trait, make sure to add the corresponding component to the whitelist in \Resources\Prototypes\Entities\Mobs\Player\clone.yml so it gets copied to clones correctly!

# Free

- type: trait
  id: Accentless
  name: trait-accentless-name
  description: trait-accentless-desc
  category: SpeechTraits
  cost: 2
  components:
  - type: Accentless
    removes:
    - type: LizardAccent
    - type: MothAccent
    - type: ReplacementAccent
      accent: scottish

# 1 Cost

- type: trait
  id: SouthernAccent
  name: trait-southern-name
  description: trait-southern-desc
  category: SpeechTraits
  cost: 1
  components:
  - type: SouthernAccent

# iss14: ported from Trauma-Station (their AddMutation effect replaced with the
# CharactersAccent component directly - this fork has no mutation system)
- type: trait
  id: SwedishAccent
  name: trait-swedish-name
  description: trait-swedish-desc
  category: SpeechTraits
  cost: 1
  components:
  - type: CharactersAccent
    chars:
      w: [ "v" ]
      j: [ "y" ]
      b: [ "bj" ]
      a: [ "å", "ä", "æ", "a" ]
      o: [ "ö", "ø", "o" ]

