- type: entity
  parent: BaseVinylForgotten
  id: VinylPeakAsshole
  name: "forgotten vinyl"
  description: "A song that we have all heard. Just not this bad... By: LuciferMkshelter" #SL  Addition
  components:
  - type: Vinyl
    song:
      path: /Audio/_Goobstation/RadioStation/Vinyls/music/peakasshole.ogg
  # Starlight begin
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Shock
        damage: 1
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          VinylSpaceAsshole:
            min: 1
            max: 1
      - !type:PopupBehavior
        popupType: Large
        popup: vinyl-heal-popup
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          VinylBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  # Starlight end



