# from _Goobstation/Entities/Structures/Furniture/cdrack.yml
- type: entity
  id: CdRack
  parent: BaseStructure
  name: CD rack
  description: Mostly filled with CDs.
  components:
  - type: Sprite
    sprite: _Goobstation/Structures/Furniture/cdrack.rsi
    snapCardinals: true
    layers:
      - state: base
      - state: cd-0
      - map: ["enum.StorageFillLayers.Fill"]
  - type: Appearance
  - type: StorageFillVisualizer
    maxFillLevels: 11
    fillBaseName: cd
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 2
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Tag
    tags:
    - Structure
    - Wooden
  - type: Transform
    anchored: true
    noRot: true
  - type: Anchorable
  - type: Storage
    grid:
    - 0,0,0,9
    whitelist:
      tags:
        - CD
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: InteractionOutline
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Construction
    graph: CdRackGraph
    node: CdRackNode

# from _Goobstation/Catalog/Fills/CDs/cdrack.yml
- type: entity
  parent: CdRack
  id: CdRackFilled
  suffix: random filled
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: RandomCDDisc
        rolls: !type:RangeNumberSelector
          range: 4, 8

# from _Goobstation/Recipes/Construction/Graphs/furniture/cdrack.yml
- type: constructionGraph
  id: CdRackGraph
  start: start
  graph:
    - node: start
      edges:
        - to: CdRackNode
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: WoodPlank
              amount: 3
              doAfter: 4
    - node: CdRackNode
      entity: CdRack

